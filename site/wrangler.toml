# Cloudflare Worker that puts the password gate in front of the board.
# The Deploy site workflow fills in the KV namespace id and your domain (cloud_sync.py configure-site).
name = "suv-price-board"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

[[kv_namespaces]]
binding = "BOARD"
id = "REPLACE_WITH_KV_ID"

