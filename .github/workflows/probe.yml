name: Probe dealer sites (temporary)

# Temporary: runs probe/probe.py on a GitHub runner, which can reach dealer websites, while the dealer source is
# being built. Removed before the branch is merged.
on:
  push:
    branches: [claude/add-kia-sportage-vehicles-rxtzm7]
    paths: ["probe/**", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -u probe/probe.py
