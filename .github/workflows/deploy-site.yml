name: Deploy site

# Publishes the password page (site/worker.js) on your domain. Run it by hand after adding the settings in the
# README, and again after changing BOARD_PASSWORD; it also runs by itself when site/ changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-site.yml"]

concurrency:
  group: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The Cloudflare secrets are also accepted under the spelling CLOUDFARE_*.
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
      BOARD_PASSWORD: ${{ secrets.BOARD_PASSWORD }}
      BOARD_DOMAIN: ${{ vars.BOARD_DOMAIN }}
    steps:
      - name: Check the settings are in place
        run: |
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$BOARD_PASSWORD" ] || missing="$missing BOARD_PASSWORD"
          [ -n "$BOARD_DOMAIN" ] || missing="$missing BOARD_DOMAIN"
          if [ -n "$missing" ]; then
            echo "::error::Add these under Settings > Secrets and variables > Actions first:$missing"
            exit 1
          fi
          # Pasted values often carry a stray space or line break, which Cloudflare rejects.
          token=$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Point the site at its storage and your domain
        run: python cloud_sync.py configure-site
      - name: Install Wrangler
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Deploy
        working-directory: site
        run: npx wrangler deploy
      - name: Set the password and the session key
        working-directory: site
        run: |
          printf '%s' "$BOARD_PASSWORD" | npx wrangler secret put BOARD_PASSWORD
          if ! npx wrangler secret list | grep -q SESSION_SECRET; then
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put SESSION_SECRET
          fi
